
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleZone BD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    header {
      background: #18263c;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ffca28;
    }
    header h1 {
      margin: 0;
      color: #ffca28;
      font-size: 27px;
    }
    header p { margin-bottom: 0; }
    main {
      max-width: 500px;
      margin: 25px auto;
      padding: 16px;
    }
    .card {
      background: #233650;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    h2 { color: #ffca28; }
    button {
      background: #ffca28;
      color: #101827;
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #b9c5d6;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚔️ BattleZone BD</h1>
    <p>Free Fire Tournament</p>
  </header>

  <main>
    <section class="card">
      <h2>স্বাগতম!</h2>
      <p>BattleZone BD টুর্নামেন্ট প্ল্যাটফর্মে তোমাকে স্বাগতম।</p>
      <p>এখানে ভবিষ্যতে টুর্নামেন্ট, ম্যাচের সময় ও ফলাফল দেখা যাবে।</p>
    </section>

    <section class="card">
      <h2>🏆 Tournament</h2>
      <p>নতুন টুর্নামেন্টের তথ্য শিগগিরই এখানে যোগ করা হবে।</p>
      <button onclick="alert('Tournament information coming soon!')">
        টুর্নামেন্ট দেখুন
      </button>
    </section>
  </main>

  <footer>© 2026 BattleZone BD</footer>
</body>
</html>
